name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install nbformat ruff

      - name: Notebooks must be valid and output-free
        run: |
          python - <<'PY'
          import glob, sys, nbformat
          failed = False
          for f in sorted(glob.glob("usecases/*.ipynb")):
              nb = nbformat.read(f, as_version=4)
              nbformat.validate(nb)  # structural validity
              dirty = [
                  i for i, c in enumerate(nb.cells)
                  if c.cell_type == "code"
                  and (c.get("outputs") or c.get("execution_count") is not None)
              ]
              if dirty:
                  failed = True
                  print(f"::error file={f}::has outputs in cells {dirty} "
                        f"— run `nbstripout {f}` before committing")
              else:
                  print(f"ok: {f}")
          sys.exit(1 if failed else 0)
          PY

      - name: Lint the crispdm package
        run: ruff check crispdm
