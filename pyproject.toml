[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, isort, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebooks and the template import lazily inside functions on purpose.
"crispdm/*.py" = ["B008"]
